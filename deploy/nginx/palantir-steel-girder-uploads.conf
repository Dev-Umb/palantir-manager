# Include in the existing server block before generic PHP locations.
# Only drawing uploads receive a 200 MiB file limit; material workbooks remain 10 MiB in Laravel.
location ~ "^/steel-girder-projects/projects/[0-9a-fA-F-]{36}/drawings$" {
    client_max_body_size 201m;
    client_body_timeout 300s;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param PHP_VALUE "upload_max_filesize=200M \n post_max_size=201M";
    fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    fastcgi_read_timeout 900s;
    fastcgi_send_timeout 300s;
}

location ~ "^/steel-girder-projects/projects/[0-9a-fA-F-]{36}/material$" {
    client_max_body_size 12m;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param PHP_VALUE "upload_max_filesize=10M \n post_max_size=12M";
    fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    fastcgi_read_timeout 300s;
}
