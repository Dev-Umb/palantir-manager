# Business create/update endpoints only; application validation still scopes file limits.
location ~ "^/(objects/[0-9]+|(objects|records)/[0-9a-fA-F-]{36})$" {
    client_max_body_size 201m;
    client_body_timeout 300s;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param PHP_VALUE "upload_max_filesize=100M \n post_max_size=201M";
    fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    fastcgi_read_timeout 900s;
    fastcgi_send_timeout 300s;
}
